[package]
name = "tao-windows-sandbox"
version = "0.0.0"
edition = "2021"
publish = false
license = "PolyForm-Noncommercial-1.0.0"

[features]
default = ["product"]
product = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
    "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Com",
    "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }
